server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /api
  # Tomcat 性能优化（支持50+并发用户）
  tomcat:
    threads:
      max: 200              # 最大工作线程数
      min-spare: 20         # 最小空闲线程
    max-connections: 500    # 最大连接数
    accept-count: 200       # 等待队列长度
    connection-timeout: 20000   # 连接超时(ms)
    keep-alive-timeout: 60000   # Keep-Alive超时(ms)

spring:
  application:
    name: image-manager-backend
  profiles:
    # 本地开发默认激活 local profile（加载 application-local.yml 中的 API Key）
    # 生产部署时设为 prod，通过环境变量注入密钥
    active: ${SPRING_PROFILES_ACTIVE:local}

  # PostgreSQL 数据库配置
  datasource:
    url: ${DATABASE_URL_JDBC:jdbc:postgresql://localhost:5432/image_management}
    # 如果 DATABASE_URL_JDBC 未设置，则从 PGDATABASE_URL 解析
    # PGDATABASE_URL 格式: postgresql://user:password@host:port/dbname
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:13369516}
    driver-class-name: org.postgresql.Driver
    # HikariCP 连接池优化（50人并发×2倍余量）
    hikari:
      auto-commit: false          # 关闭自动提交，由JPA事务管理
      maximum-pool-size: 50       # 最大连接数
      minimum-idle: 10            # 最小空闲连接
      idle-timeout: 300000        # 空闲超时5分钟
      max-lifetime: 1200000       # 连接最大存活20分钟
      connection-timeout: 10000   # 获取连接超时10秒
      validation-timeout: 5000    # 验证连接超时
      leak-detection-threshold: 60000  # 连接泄漏检测60秒

  # JPA 配置
  jpa:
    open-in-view: false  # 关闭OSIV，避免懒加载问题
    hibernate:
      ddl-auto: none  # 使用迁移脚本管理schema，避免Hibernate自动DDL导致类型转换错误
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false  # 生产关闭格式化，减少CPU开销
        jdbc:
          batch_size: 20           # JDBC批量操作
          order_inserts: true
          order_updates: true
        connection:
          provider_disables_autocommit: true
  
  # SQL 初始化配置（首次部署时使用，之后可注释掉）
  # sql:
  #   init:
  #     mode: always
  #     schema-locations: classpath:schema.sql
  #     continue-on-error: false
  
  # Redis 配置（Session 存储）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 5000
      lettuce:
        pool:
          max-active: 50
          max-idle: 10
          min-idle: 5
          max-wait: 3000
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 5GB
      max-request-size: 5GB
  
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

# 应用配置
app:
  # 后端服务 URL（用于生成图片访问链接）
  backend:
    url: ${BACKEND_URL:http://localhost:8080/api}
  
  # 前端服务 URL（用于生成文档访问链接）
  frontend:
    url: ${FRONTEND_URL:http://localhost:5000}
  
  # Cookie 安全模式配置
  # true: 生产模式，sameSite=None, secure=true（需要 HTTPS）
  # false: 开发模式，sameSite=Lax, secure=false（localhost 不需要 HTTPS）
  cookie:
    secure-mode: false

  # Redis 配置（可选，用于会话共享和热点数据缓存）
  # 安装Redis后设为 true 启用
  redis:
    enabled: false
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 5000
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 3000
  
  upload:
    path: ${UPLOAD_PATH:./uploads}
    allowed-types: jpg,jpeg,png,gif,webp,bmp
    max-size: 52428800  # 50MB for images
    document-max-size: 5368709120  # 5GB for documents
  
  # 存储配置 — S3 密钥在 StorageConfig.java 中硬编码，不在 YAML 中暴露
  storage:
    type: s3
    local-path: ./uploads
    base-url: /api
    presigned-url-expire: 604800
  
  # AI 配置（向量化 Embedding + 对话）
  # Coze API Token: 登录 https://www.coze.cn/ → 个人空间 → 设置 → 开发者令牌
  ai:
    enabled: true
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.coze.cn}
    model: doubao-seed-2-0-pro-260215

  # Ollama 配置（自托管向量化 + AI对话）
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    # 向量化模型（用于文档切片的 Embedding）
    embedding-model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
    # 对话模型（用于 AI 对话/RAG 检索；qwen3.6:35b 为多模态模型，支持图片视觉输入）
    chat-model: ${OLLAMA_CHAT_MODEL:qwen3.6:35b}
    # 多模态视觉模型（用于批量导入时图片 OCR）
    vision-model: ${OLLAMA_VISION_MODEL:qwen3.6:35b}
    # 超时配置（毫秒）
    timeout: ${OLLAMA_TIMEOUT:60000}

  # Reranker 服务配置（独立部署的文档重排序服务）
  # 基于 FlagEmbedding + bge-reranker-v2-m3，提供高精度的相关性评分
  reranker:
    # 是否启用 reranker（false 时跳过重排序，直接使用向量检索结果）
    enabled: ${RERANKER_ENABLED:true}
    # Reranker 服务地址
    base-url: ${RERANKER_BASE_URL:http://localhost:8001}
    # 请求超时（毫秒）
    timeout: ${RERANKER_TIMEOUT:5000}
  
  # MiniMax 配置：主对话已改用 Ollama 本地模型；MiniMax Anthropic 兼容端点现用于
  # 智能体联网搜索（阶段一数据隔离：仅传用户原始问题，内部业务数据不外传）
  minimax:
    api-key: ${MINIMAX_API_KEY:}
    base-url: ${MINIMAX_BASE_URL:https://api.minimaxi.com}
    model: ${MINIMAX_MODEL:MiniMax-M3}
    # 联网搜索专用模型（为空时回落 minimax.model）
    web-search-model: ${MINIMAX_WEB_SEARCH_MODEL:}
    embedding:
      base-url: ${MINIMAX_EMBEDDING_URL:https://api.minimaxi.com/v1/embeddings}
      model: ${MINIMAX_EMBEDDING_MODEL:embo-01}
      group-id: ${MINIMAX_GROUP_ID:}
  
  # 去水印配置
  watermark:
    remove:
      enabled: false  # 设置为 true 启用去水印功能
  
  # 图片增强配置
  image:
    enhance: true           # 启用图片增强（锐化、对比度调整）
    super-resolution: false # 启用超分辨率（2x放大，处理时间较长）
    # 超分辨率阈值：图片宽度小于此值时进行放大处理
    super-resolution-threshold: 800

# 日志配置
logging:
  level:
    # 只显示异步任务相关的日志
    com.imagemanager: INFO
    com.imagemanager.controller.AsyncBatchDownloadController: DEBUG
    com.imagemanager.service.BatchDownloadTaskService: DEBUG
    # 关闭其他库的日志
    org.springframework.web: WARN
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
    org.springframework.jdbc.core: WARN
  pattern:
    console: "%d{HH:mm:ss} [%thread] %msg%n"

# Milvus 向量数据库配置（200G 业务员数据）
milvus:
  enabled: ${MILVUS_ENABLED:true}
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  collection-name: ${MILVUS_COLLECTION:salesperson_chunks}
  dimension: ${MILVUS_DIMENSION:1024}

# 知识批量导入配置（200G 级流式导入，直写 Milvus）
knowledge-import:
  # 解析线程数（PDF/Excel/OCR 解析 + 切片，受 CPU 和内存约束，不宜过大）
  parse-threads: ${KI_PARSE_THREADS:2}
  # 每次调用 Ollama 批量向量化的条数
  embed-batch-size: ${KI_EMBED_BATCH:32}
  # 每批写入 Milvus 的行数
  milvus-batch-size: ${KI_MILVUS_BATCH:512}
  # 写入缓冲队列容量（背压：写满时解析线程自动阻塞）
  buffer-capacity: ${KI_BUFFER:2048}
  # 最大在途文件数（临时文件落盘数量上限，防止磁盘被占满）
  max-inflight-files: ${KI_MAX_INFLIGHT:16}
  # 图片是否启用 OCR（qwen3.6:35b 多模态）
  ocr-enabled: ${KI_OCR_ENABLED:true}
  # OCR 并发数（多模态模型重负载，4 并发约需 20G+ 显存，按显卡调整）
  ocr-concurrency: ${KI_OCR_CONCURRENCY:4}
  # 切片长度（字符）
  chunk-size: ${KI_CHUNK_SIZE:800}
  # 切片重叠（字符）
  chunk-overlap: ${KI_CHUNK_OVERLAP:100}
  # 单文件大小上限（MB），超过跳过并记录失败
  max-file-size-mb: ${KI_MAX_FILE_MB:500}
  # 最大并发导入任务数（同时只跑一个任务，避免资源争抢）
  max-concurrent-tasks: ${KI_MAX_CONCURRENT:1}
